name: M1開発基盤とSQLiteの検証

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PythonとSQLiteの確認
        run: python3 docs/database/sqlite_smoke_test.py

  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24の準備
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: ロックファイルに従って依存パッケージをインストール
        run: npm ci --no-audit --no-fund
      - name: 本番依存の脆弱性確認
        run: npm run audit:prod
      - name: 開発依存を含む脆弱性確認
        run: npm run audit:all
      - name: TypeScriptとDrizzleの型チェック
        run: npm run typecheck
      - name: Honoの単体テスト
        run: npm test
      - name: React画面のビルド
        run: npm run build:web
      - name: DrizzleマイグレーションSQLの生成
        run: npm run db:generate
      - name: 空のメモリDBでマイグレーションを検証
        run: npm run db:verify
      - name: 生成SQLとスナップショットをレビュー用に保存
        uses: actions/upload-artifact@v4
        with:
          name: m1-drizzle-generated
          path: migrations/
          if-no-files-found: error
          retention-days: 1
# 実データや秘密情報をGitHub Actionsへ送らない。
# package-lock.jsonの内容を使用し、依存ライブラリの変更を検出する。
# 脆弱性を検出した場合はCIを失敗させ、理由をレビューする。

  migration-bootstrap:
    # 一回限りの初期SQL固定。外部PRやmainでは絶対に実行しない。
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/m1-migration-baseline' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 特定ブランチのコードを取得（認証情報を保持しない）
        uses: actions/checkout@v4
        with:
          ref: chore/m1-migration-baseline
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 固定済み依存パッケージをインストール
        run: npm ci --no-audit --no-fund
      - name: 初期マイグレーションを生成
        run: npm run db:generate
      - name: 作業ブランチだけに生成結果をコミット
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- migrations/)" ]; then
            echo "初期マイグレーションは既に登録されています。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/
          git diff --cached --check
          git commit -m "chore: Drizzle初期マイグレーションを版管理"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/chore/m1-migration-baseline
