name: M1設計の簡易テスト

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ソースコードのみを取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: SQLiteとPythonのバージョンを確認
        run: |
          python3 --version
          python3 -c 'import sqlite3; print("SQLite:", sqlite3.sqlite_version)'
      - name: 合成データでM1の簡易テストを実行
        run: python3 docs/database/sqlite_smoke_test.py
# 重要：実際の原本・本番SQLite・秘密情報・音声はCIへ渡さない。
# package.jsonとロックファイルの導入後、TypeScript・Drizzleの型チェックを追加する。
