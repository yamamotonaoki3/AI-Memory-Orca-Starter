name: M1開発基盤とSQLiteの検証

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PythonとSQLiteの確認
        run: python3 docs/database/sqlite_smoke_test.py

  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24の準備
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 依存パッケージの導入（初期検証）
        run: npm install --no-audit --no-fund
      - name: TypeScriptとDrizzleの型チェック
        run: npm run typecheck
      - name: Honoの単体テスト
        run: npm test
      - name: React画面のビルド
        run: npm run build:web
      - name: DrizzleマイグレーションSQLの生成
        run: npm run db:generate
      - name: 空のメモリDBでマイグレーションを検証
        run: npm run db:verify
# 実データや秘密情報をGitHub Actionsへ送らない。
# ロックファイルが確定したら、npm installをnpm ciへ切り替える。
